name: docker-release

# ==================================================================
# magic-api-server 镜像发布流水线
#
# 触发方式：
#   1. 发布 GitHub Release（tag 如 v2.2.2 或 2.2.2）→ 自动推送
#      docker.io/<DOCKERHUB_USERNAME>/magic-api-server:<version> 与 :latest
#   2. Actions 页手动触发（Run workflow）→ 指定版本，可选是否更新 latest
#
# 前置配置（仓库 Settings → Secrets and variables → Actions）：
#   DOCKERHUB_USERNAME  Docker Hub 用户名（同时决定镜像命名空间，换账号只改这里）
#   DOCKERHUB_TOKEN     Docker Hub Access Token（权限需 Read & Write）
#   （Docker Hub → Account Settings → Security → New Access Token 生成）
# ==================================================================

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号（如 2.2.2 或 v2.2.2，自动去 v 前缀）'
        required: true
        type: string
      push_latest:
        description: '是否同时更新 latest 标签'
        required: false
        type: boolean
        default: true

env:
  # 镜像仓库名（不含命名空间）。命名空间动态取自 Secret DOCKERHUB_USERNAME，
  # 在归一化步骤拼出完整镜像名（workflow 级 env 不支持 secrets 上下文）
  REPO_NAME: magic-api-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # release 事件取 tag_name，dispatch 事件取输入 version；
      # 统一去 v 前缀；push_latest=false（仅 dispatch 可选）时不附加 latest
      - name: 归一化版本号与 tag 列表
        id: ver
        env:
          RAW_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
          PUSH_LATEST: ${{ github.event_name == 'release' && 'true' || inputs.push_latest }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME }}
        run: |
          VERSION="${RAW_VERSION#v}"
          TAGS="${IMAGE}:${VERSION}"
          if [ "$PUSH_LATEST" = "true" ]; then
            TAGS="$(printf '%s\n%s' "${TAGS}" "${IMAGE}:latest")"
          fi
          {
            echo "version=${VERSION}"
            echo "push_latest=${PUSH_LATEST}"
            echo "image=${IMAGE}"
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "推送 tag 列表:"
          echo "${TAGS}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 构建上下文 = 仓库根（多模块 Maven 工程），自动读取
      # magic-api-server/Dockerfile.dockerignore 剔除无关内容
      - name: Build and push
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: magic-api-server/Dockerfile
          push: true
          tags: ${{ steps.ver.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 记录镜像 digest
        if: always()
        env:
          IMAGE: ${{ steps.ver.outputs.image }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          REF="${IMAGE}:${VERSION}"
          echo "image=${REF}" > digest.txt
          echo "push_latest=${{ steps.ver.outputs.push_latest }}" >> digest.txt
          DIGEST="$(docker buildx imagetools inspect "${REF}" --format '{{json .Manifest.Digest}}' 2>/dev/null || echo 'push-failed-or-skipped')"
          echo "digest=${DIGEST}" >> digest.txt
          cat digest.txt

      - name: Upload digest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: digest.txt
          if-no-files-found: warn
          retention-days: 30

      # 同步 Short description + README 到 Docker Hub 仓库页面
      # （magic-api-server/DOCKERHUB_README.md 即 Docker Hub 展示的详细描述）
      - name: Sync Docker Hub description
        if: always() && steps.ver.outcome == 'success' && steps.build-push.outcome == 'success'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ steps.ver.outputs.image }}
          short-description: 'magic-api 服务端开箱即用镜像：Web 编辑器在线开发 HTTP API，无需重启实时发布'
          readme-filepath: magic-api-server/DOCKERHUB_README.md
