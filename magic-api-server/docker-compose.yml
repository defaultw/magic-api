# ==================================================================
# magic-api-server Docker Compose
#
# 用法（在 magic-api-server/ 目录执行）：
#   docker compose up -d --build     # 构建并启动
#   docker compose logs -f           # 看日志
#   docker compose down              # 停止（数据保留在 ./magic-api-data/）
#
# 持久化：容器内 /data/magic-api 绑定挂载到宿主机 ./magic-api-data，
# 接口/分组/函数/数据源文件全部落在宿主机目录，容器删除不丢数据。
# ==================================================================
services:
  magic-api-server:
    build:
      context: ..
      dockerfile: magic-api-server/Dockerfile
      args:
        MAVEN_MIRROR_URL: https://maven.aliyun.com/repository/public
        NPM_REGISTRY: https://registry.npmmirror.com
    image: magic-api-server:2.2.2
    container_name: magic-api-server
    ports:
      - "9999:9999"
    environment:
      TZ: Asia/Shanghai
      # JAVA_OPTS: "-Xms512m -Xmx1024m"   # 按需覆盖 JVM 内存参数
    env_file:
      # 凭据经环境变量注入（模板见 magic-api.env.example）。
      # required: false —— 文件不存在不阻断启动（OIDC/密码登录不可用，服务正常）
      - path: ./magic-api.env
        required: false
    volumes:
      # 持久化目录暴露到宿主机：接口脚本/分组/函数/数据源
      - ./magic-api-data:/data/magic-api
      # 可选：本地凭据文件注入（与 env 文件二选一即可；文件不存在时勿放开，
      # 否则 Docker 会创建同名空目录）
      # - ./application-local.yml:/app/application-local.yml:ro
    restart: unless-stopped
