# ==================================================================
# Magic API Server - 账号密码登录（默认开启）+ 可选 OIDC 统一认证 + MCP 服务端
#
# 0. 开箱即用：默认账号 admin / 密码 123456（公开默认凭据，非个人秘密）。
#    生产环境必须用环境变量覆盖：
#      MAGIC_API_SECURITY_USERNAME / MAGIC_API_SECURITY_PASSWORD
# 1. 全部认证配置均有环境变量占位符（Docker 注入见 DEPLOY-DOCKER.md 第七节）：
#      MAGIC_API_SECURITY_USERNAME / MAGIC_API_SECURITY_PASSWORD   编辑器账号密码（默认 admin/123456）
#      MAGIC_API_OAUTH2_ENABLED                                    统一认证开关（默认 false）
#      MAGIC_API_OAUTH2_CLIENT_ID / MAGIC_API_OAUTH2_CLIENT_SECRET OIDC 应用凭据（启用 OIDC 时必填）
#      MAGIC_API_SECURITY_PASSWORD_LOGIN_ENABLED                   密码登录开关（默认 true）
#      MAGIC_API_OAUTH2_AUTO_REDIRECT                              打开编辑器自动跳转授权页（默认 false）
#      MAGIC_API_MCP_TOKEN                                         MCP 端点鉴权 token（默认空=不鉴权）
#    也可工作目录放 application-local.yml 注入（模板见同目录 application-local.yml.example，
#    已被 .gitignore 排除，不会提交）。
# 2. OIDC（可选）：enabled=true 时编辑器出现「统一认证登录 / OIDC Login」按钮。
#    TOPIAM 应用「登录 Redirect URI 白名单」需与 redirect-uri 逐字符一致：
#      http://127.0.0.1:9999/magic/web/oauth2/callback
#    （请通过 http://127.0.0.1:9999/magic/web/index.html 访问编辑器）
# 3. 启动方式（需在 magic-api-server 目录下启动，file 存储用相对路径）：
#      cd magic-api-server
#      java -jar target/magic-api-server-2.2.2.jar
#    （或 mvn -pl magic-api-server spring-boot:run）
#    生产部署（systemd）见同目录 DEPLOY.md；Docker 部署见 DEPLOY-DOCKER.md
# 4. 验证流程：
#      默认：访问 http://127.0.0.1:9999/magic/web/index.html -> admin/123456 登录
#      OIDC：MAGIC_API_OAUTH2_ENABLED=true -> 登录页点击「统一认证登录」跳转 IdP
#            -> 回调 /magic/web/oauth2/callback -> 302 回 index.html?magic-token=...
# 5. ⚠ 历史提交曾含明文凭据且已推送远程，请务必在 TOPIAM 轮换 client-secret 并更换编辑器密码。
# ==================================================================
server:
  port: 9999

# 可选导入工作目录下的 application-local.yml（本地凭据文件，不存在不报错）
spring:
  config:
    import: "optional:file:./application-local.yml"

magic-api:
  web: /magic/web
  prefix:                # 留空：不启用业务接口前缀（验证环境最简）
  mcp:
    enabled: true
    # MCP 端点鉴权 token：配置后所有 /mcp/magic 请求必须携带 X-Mcp-Token 或 Authorization: Bearer <token>，
    # 否则返回 401。经环境变量注入（可写入 application-local.yml 或生产 EnvironmentFile），禁止明文入库
    token: ${MAGIC_API_MCP_TOKEN:}
  resource:
    type: file
    location: ./magic-api-files/   # 相对路径，实际目录 = JVM 启动时工作目录 + magic-api-files/（详见 DEPLOY.md「数据存储」）
  task:
    thread-name-prefix: magic-task- #线程池名字前缀
    pool:
      size: 8 #线程池大小，默认值为CPU核心数
    shutdown:
      awaitTermination: false #关闭时是否等待任务执行完毕，默认为false
      awaitTerminationPeriod: 10s # 关闭时最多等待任务执行完毕的时间
  security:
    username: ${MAGIC_API_SECURITY_USERNAME:admin}   # 默认公开凭据 admin/123456，生产必须用环境变量覆盖（见文件头）
    password: ${MAGIC_API_SECURITY_PASSWORD:123456}
    oauth2:
      enabled: ${MAGIC_API_OAUTH2_ENABLED:false}   # 默认关闭统一认证；true 需同时注入 client-id/client-secret
      # TOPIAM OIDC 配置
      issuer: https://iam.xiaojiang.wang/api/v1/authorize/esvtb7mdq12gixytwzpaojailynovz6c/oidc
      client-id: ${MAGIC_API_OAUTH2_CLIENT_ID:}
      client-secret: ${MAGIC_API_OAUTH2_CLIENT_SECRET:}
      # 显式固定回调地址，必须与 TOPIAM「登录 Redirect URI 白名单」某一条逐字符完全一致
      # （当前 TOPIAM 白名单为 127.0.0.1 版本；若白名单用 localhost，请同步改回 localhost）
      redirect-uri: http://127.0.0.1:9999/magic/web/oauth2/callback
      # scope 必须是 TOPIAM 应用允许的范围；TOPIAM 默认拒绝了 profile，先用最小集 openid
      # （如需真实用户名 preferred_username，需在 TOPIAM 应用侧启用 profile 后改回 "openid profile"）
      scopes: openid
      # TOPIAM 强制要求 PKCE，必须开启（关闭会报 invalid_request: code_challenge）
      use-pkce: true
      auto-redirect: ${MAGIC_API_OAUTH2_AUTO_REDIRECT:false}   # true 时打开编辑器直接跳转 IdP 授权页
      password-login-enabled: ${MAGIC_API_SECURITY_PASSWORD_LOGIN_ENABLED:true} # 默认启用账号密码登录；false 时仅 OIDC
